<html lang="en-GB">
<head>
<meta charset="utf-8">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Physics cards">
<meta name="theme-color" content="#f6f4ee">
<title>Physics cards</title>
<link rel="manifest" href='data:application/manifest+json,{"name":"Physics cards","short_name":"Physics","start_url":"physics_cards.html","display":"standalone","background_color":"%23f6f4ee","theme_color":"%23f6f4ee"}'>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: #f6f4ee; color: #1b2238; font-family: -apple-system, "Helvetica Neue", Arial, sans-serif; font-size: 17px; line-height: 1.45; }
  body { padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  .screen { display: none; padding: 16px; max-width: 560px; margin: 0 auto; }
  .screen.on { display: block; }
  h1 { font-size: 30px; margin: 8px 0 14px; color: #1b2f5e; letter-spacing: -0.3px; }
  h2 { font-size: 14px; text-transform: uppercase; letter-spacing: 1.2px; color: #6b7280; margin: 22px 0 8px; }
  .panel { background: #ffffff; border: 1px solid #dfe3ec; border-radius: 14px; padding: 14px 16px; margin-bottom: 12px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .big { font-size: 22px; font-weight: 700; }
  .muted { color: #6b7280; font-size: 15px; }
  button { font: inherit; border: 0; border-radius: 12px; padding: 12px 16px; background: #1b2f5e; color: #ffffff; font-weight: 600; cursor: pointer; min-height: 46px; }
  button.ghost { background: #ffffff; color: #1b2f5e; border: 1.5px solid #c9d0de; }
  button.small { padding: 8px 12px; min-height: 38px; font-size: 15px; }
  button:disabled { opacity: 0.4; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 6px 0 4px; }
  .chip { padding: 8px 13px; border-radius: 999px; border: 1.5px solid #c9d0de; background: #ffffff; color: #1b2f5e; font-size: 15px; font-weight: 600; min-height: 38px; }
  .chip.on { background: #1b2f5e; color: #ffffff; border-color: #1b2f5e; }
  .deck { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid #eef0f4; }
  .deck:first-child { border-top: 0; }
  .deck .name { font-weight: 700; font-size: 18px; }
  .deck .count { color: #6b7280; font-size: 14px; }
  .bar { height: 10px; border-radius: 6px; background: #e5e7eb; overflow: hidden; display: flex; margin-top: 6px; }
  .bar span { display: block; height: 100%; }
  .g { background: #2f9e6b; } .s { background: #e0a100; } .n { background: #d9534f; }
  .radio { width: 24px; height: 24px; border-radius: 50%; border: 2px solid #1b2f5e; flex: none; }
  .deck.sel .radio { background: #1b2f5e; box-shadow: inset 0 0 0 4px #ffffff; }
  .actions { display: flex; gap: 10px; margin-top: 14px; }
  .actions button { flex: 1; }
  #targetEdit { display: none; align-items: center; gap: 12px; margin-top: 10px; }
  #targetEdit.on { display: flex; }
  #targetVal { font-size: 24px; font-weight: 700; min-width: 40px; text-align: center; }

  /* card screen */
  .topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .counter { font-weight: 700; color: #1b2f5e; }
  .tags { font-size: 13px; color: #6b7280; margin-bottom: 8px; }
  .eoy { display: inline-block; background: #fef3c7; color: #92400e; border: 1px solid #f59e0b; border-radius: 6px; padding: 1px 7px; font-weight: 700; font-size: 12px; margin-left: 6px; }
  .card { background: #ffffff; border: 1px solid #dfe3ec; border-radius: 18px; padding: 18px; min-height: 300px; box-shadow: 0 2px 10px rgba(27,47,94,0.06); position: relative; }
  .card .star { position: absolute; top: 10px; right: 10px; width: 44px; height: 44px; border-radius: 50%; background: #ffffff; border: 1.5px solid #c9d0de; color: #c9d0de; font-size: 24px; padding: 0; min-height: 0; line-height: 44px; }
  .card .star.on { color: #e0a100; border-color: #e0a100; }
  .face { display: none; padding-right: 36px; }
  .face.on { display: block; }
  .front .q { font-size: 21px; font-weight: 700; margin: 6px 40px 8px 0; }
  .fig { margin: 4px 0 12px; }
  .fig svg { width: 100%; height: auto; display: block; }
  .hint { color: #6b7280; font-size: 14px; margin-top: 12px; }
  .back .line { font-size: 19px; margin: 6px 0; }
  .qsmall { color: #6b7280; font-size: 14px; border-left: 3px solid #dfe3ec; padding-left: 10px; margin: 0 0 12px; }
  .back .line.eq { font-family: "Helvetica Neue", Arial, sans-serif; }
  .k { color: #1d4ed8; font-weight: 700; }
  .u { color: #b45309; font-weight: 700; }
  .lbl { display: block; color: #6b7280; font-size: 12px; text-transform: uppercase; letter-spacing: 0.8px; margin-top: 8px; }
  .yours { margin-top: 12px; padding: 10px 12px; border-radius: 10px; background: #f3f4f6; }
  .yours .lbl2 { font-size: 13px; color: #6b7280; text-transform: uppercase; letter-spacing: 0.8px; }
  textarea, input[type=text] { width: 100%; font: inherit; padding: 12px; border-radius: 10px; border: 1.5px solid #c9d0de; margin-top: 12px; }
  .marks { display: none; gap: 8px; margin-top: 14px; }
  .marks.on { display: flex; }
  .marks button { flex: 1; padding: 14px 6px; }
  .mNot { background: #d9534f; } .mShaky { background: #e0a100; } .mGot { background: #2f9e6b; }
  .nav { display: flex; justify-content: space-between; margin-top: 14px; }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: #1b2f5e; color: #ffffff; padding: 10px 16px; border-radius: 10px; font-size: 15px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.on { opacity: 1; }
  .note { font-size: 14px; color: #92400e; background: #fef3c7; border-radius: 10px; padding: 10px 12px; margin-bottom: 12px; display: none; }
  .note.on { display: block; }
</style>
</head>
<body>

<!-- ============ HOME ============ -->
<section id="home" class="screen on">
  <h1>Physics cards</h1>
  <div id="storeNote" class="note">Progress is not saved in this viewer. Open the link in Safari to keep your marks.</div>

  <div class="panel">
    <div class="row">
      <div><div class="big" id="todayLine">0 of 10 today</div><div class="muted">daily target</div></div>
      <button class="ghost small" id="btnSet">Set</button>
    </div>
    <div id="targetEdit">
      <button class="ghost small" id="tMinus">&minus;</button>
      <div id="targetVal">10</div>
      <button class="ghost small" id="tPlus">+</button>
      <button class="small" id="tDone">Done</button>
    </div>
  </div>

  <h2>Deck</h2>
  <div class="panel" id="deckList"></div>

  <h2>Show only</h2>
  <div class="chips" id="typeChips"></div>
  <div class="chips">
    <button class="chip" data-flag="eoy">EOY priority only</button>
    <button class="chip" data-flag="star">&#9733; Starred</button>
    <button class="chip" data-flag="notyet">Not yet</button>
    <button class="chip" data-flag="type">Type the answer</button>
  </div>

  <div class="actions">
    <button id="btnStart">Start</button>
    <button class="ghost" id="btnReset">Reset deck</button>
    <button class="ghost" id="btnExport">Export</button>
  </div>
  <div id="resetBox" class="panel" style="display:none; margin-top:12px">
    <div>Clear all marks and stars in this deck?</div>
    <div class="actions"><button id="resetYes" class="mNot">Yes, clear</button><button class="ghost" id="resetNo">Keep</button></div>
  </div>
  <div id="exportBox" style="display:none">
    <textarea id="exportText" rows="8" readonly></textarea>
    <div class="actions"><button id="copyExport">Copy</button><button class="ghost" id="closeExport">Close</button></div>
  </div>
</section>

<!-- ============ CARD ============ -->
<section id="study" class="screen">
  <div class="topbar">
    <button class="ghost small" id="btnHome">Home</button>
    <div class="counter" id="counter">1 of 18</div>
    <div style="width:70px"></div>
  </div>
  <div class="tags" id="tags"></div>
  <div class="card" id="card">
    <button class="star" id="btnStar">&#9733;</button>
    <div class="face front on" id="front"></div>
    <div class="face back" id="back"></div>
  </div>
  <div class="marks" id="marks">
    <button class="mNot" data-m="n">Not yet</button>
    <button class="mShaky" data-m="s">Shaky</button>
    <button class="mGot" data-m="g">Got it</button>
  </div>
  <div class="nav">
    <button class="ghost" id="btnPrev">&#8592; Back</button>
    <button class="ghost" id="btnNext">Next &#8594;</button>
  </div>
</section>

<div class="toast" id="toast"></div>

const TYPES = {graph:"Graph reading", explain:"Explain", formula:"Formula", calc:"Calculation", definition:"Definition"};

/* ---------- storage (safe) ---------- */
let mem = {};
let storageOK = true;
function load(){ try { const s = localStorage.getItem("physcards"); mem = s ? JSON.parse(s) : {}; } catch(e){ storageOK = false; mem = {}; } }
function save(){ try { localStorage.setItem("physcards", JSON.stringify(mem)); } catch(e){ storageOK = false; } }
function st(){ mem.cards = mem.cards || {}; mem.target = mem.target || 10; mem.today = mem.today || {date:"", n:0}; return mem; }
function cs(id){ st(); mem.cards[id] = mem.cards[id] || {mark:"", star:false}; return mem.cards[id]; }
function todayKey(){ return new Date().toISOString().slice(0,10); }
function todayCount(){ st(); if (mem.today.date !== todayKey()) { mem.today = {date: todayKey(), n: 0}; } return mem.today.n; }

/* ---------- state ---------- */
let deck = "all", typeFilter = "", flags = {eoy:false, star:false, notyet:false, type:false};
let queue = [], pos = 0, flipped = false;

/* ---------- home ---------- */
const $ = id => document.getElementById(id);
function deckCards(d){ const D = DECKS.find(x=>x.id===d); return CARDS.filter(c=>D.chs.includes(c.ch)); }
function renderHome(){
  $("todayLine").textContent = `${todayCount()} of ${st().target} today`;
  $("targetVal").textContent = st().target;
  $("storeNote").classList.toggle("on", !storageOK);
  const list = $("deckList"); list.innerHTML = "";
  DECKS.forEach(D=>{
    const cards = deckCards(D.id);
    let g=0,s=0,n=0; cards.forEach(c=>{ const m=cs(c.id).mark; if(m==="g")g++; else if(m==="s")s++; else if(m==="n")n++; });
    const stars = cards.filter(c=>cs(c.id).star).length;
    const el = document.createElement("div"); el.className = "deck" + (deck===D.id?" sel":"");
    el.innerHTML = `<div class="radio"></div><div style="flex:1"><div class="name">${D.name}</div><div class="count">${cards.length} cards · ${cards.filter(c=>c.eoy).length} EOY · ${g} got it · ${s} shaky · ${n} not yet${stars?" · "+stars+" starred":""}</div><div class="bar"><span class="g" style="width:${g/cards.length*100}%"></span><span class="s" style="width:${s/cards.length*100}%"></span><span class="n" style="width:${n/cards.length*100}%"></span></div></div>`;
    el.onclick = ()=>{ deck = D.id; renderHome(); };
    list.appendChild(el);
  });
  const tc = $("typeChips"); tc.innerHTML = "";
  Object.keys(TYPES).forEach(t=>{ const b=document.createElement("button"); b.className="chip"+(typeFilter===t?" on":""); b.textContent=TYPES[t]; b.onclick=()=>{ typeFilter = typeFilter===t?"":t; renderHome(); }; tc.appendChild(b); });
  document.querySelectorAll("[data-flag]").forEach(b=>{ b.classList.toggle("on", flags[b.dataset.flag]); b.onclick=()=>{ flags[b.dataset.flag]=!flags[b.dataset.flag]; renderHome(); }; });
  $("btnStart").disabled = filtered().length === 0;
  $("btnStart").textContent = `Start (${filtered().length})`;
}
function filtered(){
  return deckCards(deck).filter(c => (!typeFilter || c.type===typeFilter) && (!flags.star || cs(c.id).star) && (!flags.notyet || cs(c.id).mark==="n" || cs(c.id).mark==="") && (!flags.type || c.typed) && (!flags.eoy || c.eoy));
}
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function buildQueue(){
  const pr = {n:0, "":1, s:2, g:3};
  const groups = [[],[],[],[]];
  filtered().forEach(c=>groups[pr[cs(c.id).mark]].push(c));
  queue = groups.flatMap(g=>shuffle(g)); pos = 0;
}

/* ---------- study ---------- */
function show(id){ document.querySelectorAll(".screen").forEach(s=>s.classList.remove("on")); $(id).classList.add("on"); window.scrollTo(0,0); }
function renderCard(){
  if (pos >= queue.length){ toast("Finished this round"); show("home"); renderHome(); return; }
  const c = queue[pos]; flipped = false;
  $("counter").textContent = `${pos+1} of ${queue.length}`;
  $("tags").innerHTML = `Chapter ${c.ch} · ${TYPES[c.type]}` + (c.eoy ? ` <span class="eoy">EOY</span>` : "");
  $("btnStar").classList.toggle("on", cs(c.id).star);
  const typed = c.typed && flags.type;
  $("front").innerHTML = (c.fig ? `<div class="fig">${FIG[c.fig]}</div>` : "") + `<div class="q">${c.front}</div>` +
    (typed ? `<input type="text" id="typedIn" placeholder="Type your answer" autocomplete="off"><div class="actions"><button id="btnCheck">Check</button></div>` : `<div class="hint">Tap the card to see the answer</div>`);
  $("back").innerHTML = (c.fig ? `<div class="fig">${FIG[c.fig]}</div>` : "") + `<div class="qsmall">${c.front}</div>` + c.back;
  $("front").classList.add("on"); $("back").classList.remove("on"); $("marks").classList.remove("on");
  $("btnPrev").disabled = pos===0;
  if (typed){ const inp = $("typedIn"); inp.onclick = e=>e.stopPropagation(); $("btnCheck").onclick = e=>{ e.stopPropagation(); flip(inp.value); }; }
}
function flip(yours){
  const c = queue[pos];
  if (flipped) return;
  flipped = true;
  if (yours !== undefined && !$("back").querySelector(".yours")){ $("back").innerHTML += `<div class="yours"><div class="lbl2">Your answer</div>${yours ? yours.replace(/</g,"&lt;") : "(blank)"}</div>`; }
  $("front").classList.remove("on"); $("back").classList.add("on"); $("marks").classList.add("on");
}
function unflip(){ flipped = false; $("front").classList.add("on"); $("back").classList.remove("on"); $("marks").classList.remove("on"); }
function mark(m){
  const c = queue[pos]; cs(c.id).mark = m;
  todayCount(); mem.today.n++; save();
  if (m==="n") queue.splice(Math.min(pos+3, queue.length), 0, c);
  else if (m==="s") queue.splice(Math.min(pos+6, queue.length), 0, c);
  pos++; renderCard();
}
function toast(t){ const el=$("toast"); el.textContent=t; el.classList.add("on"); setTimeout(()=>el.classList.remove("on"),1500); }

/* ---------- wiring ---------- */
load(); st();
$("btnSet").onclick = ()=>$("targetEdit").classList.toggle("on");
$("tMinus").onclick = ()=>{ mem.target = Math.max(1, mem.target-1); save(); renderHome(); };
$("tPlus").onclick = ()=>{ mem.target = Math.min(60, mem.target+1); save(); renderHome(); };
$("tDone").onclick = ()=>{ $("targetEdit").classList.remove("on"); renderHome(); };
$("btnStart").onclick = ()=>{ buildQueue(); show("study"); renderCard(); };
$("btnReset").onclick = ()=>{ $("resetBox").style.display = "block"; };
$("resetNo").onclick = ()=>{ $("resetBox").style.display = "none"; };
$("resetYes").onclick = ()=>{ deckCards(deck).forEach(c=>{ mem.cards[c.id] = {mark:"", star:false}; }); save(); $("resetBox").style.display="none"; renderHome(); toast("Deck cleared"); };
$("btnExport").onclick = ()=>{
  const lines = deckCards(deck).filter(c=>["n","s"].includes(cs(c.id).mark)).map(c=>`${cs(c.id).mark==="n"?"NOT YET":"SHAKY"} · Ch ${c.ch} · Card ${c.id}: ${c.front}`);
  $("exportText").value = lines.length ? `Physics cards, ${todayKey()}\n` + lines.join("\n") : "Nothing marked not yet or shaky in this deck.";
  $("exportBox").style.display = "block";
};
$("copyExport").onclick = ()=>{ const t=$("exportText"); t.select(); t.setSelectionRange(0,99999); try{ document.execCommand("copy"); toast("Copied"); }catch(e){ toast("Select and copy the text"); } };
$("closeExport").onclick = ()=>{ $("exportBox").style.display = "none"; };
$("btnHome").onclick = ()=>{ show("home"); renderHome(); };
$("card").onclick = e=>{ if (e.target.id==="btnStar") return; if (flipped) { unflip(); return; } if (!(queue[pos].typed && flags.type)) flip(); };
$("btnStar").onclick = e=>{ e.stopPropagation(); const c=queue[pos]; cs(c.id).star = !cs(c.id).star; save(); $("btnStar").classList.toggle("on", cs(c.id).star); };
document.querySelectorAll("#marks button").forEach(b=>b.onclick = ()=>mark(b.dataset.m));
$("btnPrev").onclick = ()=>{ if (pos>0){ pos--; renderCard(); } };
$("btnNext").onclick = ()=>{ pos++; renderCard(); };
renderHome();

/* offline: service worker (only works when served from a web address) */
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) { navigator.serviceWorker.register("sw.js").catch(()=>{}); }
</script>
